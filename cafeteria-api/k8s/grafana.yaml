
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafeteria-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cafeteria-grafana
  template:
    metadata:
      labels:
        app: cafeteria-grafana
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: grafana
          image: grafana/grafana:13.3.0
          ports:
            - containerPort: 3000

          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-user

            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password

          securityContext:
            runAsNonRoot: true
            runAsUser: 472
            runAsGroup: 472
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana

            - name: grafana-logs
              mountPath: /var/log/grafana

            - name: tmp
              mountPath: /tmp

      volumes:
        - name: grafana-data
          emptyDir: {}

        - name: grafana-logs
          emptyDir: {}

        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: cafeteria-grafana
spec:
  selector:
    app: cafeteria-grafana
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
