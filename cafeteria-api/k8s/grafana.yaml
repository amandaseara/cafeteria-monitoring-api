
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafeteria-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cafeteria-grafana
  template:
    metadata:
      labels:
        app: cafeteria-grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: cafeteria123
---
apiVersion: v1
kind: Service
metadata:
  name: cafeteria-grafana
spec:
  selector:
    app: cafeteria-grafana
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
