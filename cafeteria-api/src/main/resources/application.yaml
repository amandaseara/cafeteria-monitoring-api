spring:
  application:
    name: cafeteria-api

  datasource:
      url: jdbc:h2:mem:cafeteriadb
      driver-class-name: org.h2.Driver
      username: sa
      password: ""

  jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      open-in-view: false

  h2:
      console:
        enabled: true
        path: /h2-console

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      probes:
        enabled: true

  metrics:
      tags:
        application: ${spring.application.name}
